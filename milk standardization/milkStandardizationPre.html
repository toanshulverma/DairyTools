<!DOCTYPE html>
<html data-theme="light">
	<!--
		Libraries used:
		Pico (for CSS styling): https://picocss.com/
		SVG Icons: https://tabler.io/icons
	-->
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
  <title>Milk Standardization Calculator (Pre)</title>
  <style>
	@media (min-width: 768px) {
	  :root,
	  :host {
		--pico-font-size: 2.1em;
	  }
	}
	@media (min-width: 1000px) {
	  :root,
	  :host {
		--pico-font-size: 1em;
	  }
	}
  </style>
</head>
<body>
  <main class="container-fluid">
		<h2>Milk Standardization Calculator</h2>
		<h5>(क्रीम निकालने से पहले)</h5>
		
		<fieldset>
          	<label>दूध की मात्रा </label>
			<input type="number" id="milkQuantity" value="100" required />
          	<!--  Tell us  How much Kgs of milk  you want to  standardize?  -->

          	<label>उपलब्ध दूध का फैट% (FAT) क्या है?</label>
            <input type="number" id="currentFatPercent" value="5" required/>
          	<!--  What is the FAT% of the  Milk-->

          	<label>दूध में आपको कितने % फैट की आवश्यकता है? </label>
            <input type="number" id="targetFatPercent" value="4" required/>
          	<!--  What Fat% is  required in the Low fat standardized Milk -->

			<label>मिलने वाली क्रीम का फैट% कितना होता है। यदि ज्ञात नहीं है, तो 40% लिखें।</label>
			<input type="number" id="creamFatPercent" value="40" required/>
           	<!--  What is the Fat %  of the cream you  get after separation. If not known, write 50%.-->
        </fieldset>
        <button onclick="return calculate();">Calculate</button>
		<br/>
		<br/>
		<h3>Result</h3>
		<span id="msg" style="color:red"></span> </div>
		<div id="resultsCard" style="display:none">
			<table class="striped">
				<tr>
					<td>अलग की जाने वाले दूध (किलोग्राम)</td>
					<td> <span id="milkToUseForCreamSeparation"></span></td>
				</tr>
				<tr>
					<td>मानकीकृत दूध में फैट% का मानकीकरण (%)</td>
					<td>
						<span id="fatPercentOfRemainingMilk"></span>
						<span id="calcSuccess">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="green" class="icon icon-tabler icons-tabler-filled icon-tabler-circle-check"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 3.34a10 10 0 1 1 -14.995 8.984l-.005 -.324l.005 -.324a10 10 0 0 1 14.995 -8.336zm-1.293 5.953a1 1 0 0 0 -1.32 -.083l-.094 .083l-3.293 3.292l-1.293 -1.292l-.094 -.083a1 1 0 0 0 -1.403 1.403l.083 .094l2 2l.094 .083a1 1 0 0 0 1.226 0l.094 -.083l4 -4l.083 -.094a1 1 0 0 0 -.083 -1.32z" /></svg>
						</span>

						<span id="calcError">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="red" class="icon icon-tabler icons-tabler-filled icon-tabler-circle-x"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 3.34a10 10 0 1 1 -14.995 8.984l-.005 -.324l.005 -.324a10 10 0 0 1 14.995 -8.336zm-6.489 5.8a1 1 0 0 0 -1.218 1.567l1.292 1.293l-1.292 1.293l-.083 .094a1 1 0 0 0 1.497 1.32l1.293 -1.292l1.293 1.292l.094 .083a1 1 0 0 0 1.32 -1.497l-1.292 -1.293l1.292 -1.293l.083 -.094a1 1 0 0 0 -1.497 -1.32l-1.293 1.292l-1.293 -1.292l-.094 -.083z" /></svg>
						</span>
					
					</td>
				</tr>
				<tr>
					<td>अलग की जाने वाली क्रीम (किलोग्राम)</td>
					<td> <span id="creamQuantity"></span></td>
				</tr>
				<tr>
					<td>मानकीकृत दूध की मात्रा (किलोग्राम)</td>
					<td><span id="milkOutput"></span></td>
				</tr>
			</table>
		</div>
  </main>
</body>

<script>
	function calculate(){
		
		milkQuantity = parseFloat(document.getElementById("milkQuantity").value);
		currentFatPercent = parseFloat(document.getElementById("currentFatPercent").value);
		targetFatPercent = parseFloat(document.getElementById("targetFatPercent").value);
		creamFatPercent = parseFloat(document.getElementById("creamFatPercent").value);
		
		fatDiff = currentFatPercent - targetFatPercent;
		
		if(milkQuantity <=0){
			document.getElementById("msg").innerHTML = "दूध की मात्रा आवश्यक है"
			document.getElementById("resultsCard").style.display = 'none';
			document.getElementById("msg").style.display = '';
		}
		else if(fatDiff <=0){
			fatToSeparate = 0;
			document.getElementById("msg").innerHTML = "गलत मान; लक्ष्य फैट प्रतिशत वर्तमान फैट प्रतिशत से कम नहीं हो सकता"
			document.getElementById("resultsCard").style.display = 'none';
			document.getElementById("msg").style.display = '';
		}
		else{
		
			//calculate % of fat% to be reduced
			fatPrecentToSeparate = (currentFatPercent - targetFatPercent) / currentFatPercent; 

			fatToSeparate = creamFatPercent - currentFatPercent;
			Y = fatToSeparate / (  fatDiff + fatToSeparate);
			Z = fatDiff / (  fatDiff + fatToSeparate);
		
		
			creamQuantity = milkQuantity * Z;	// Qty of Cream to be separated (Kgs)
		
			milkOutput = milkQuantity * Y;		// Output of Milk Kgs of desired fat
			
			//calculate milk to be removed, so that it is mixed back (after milk separation) the Fat% of combined milk comes to target Fat%
			milkToUseForCreamSeparation = Math.floor(milkQuantity * fatPrecentToSeparate);
		
			//For double-checking - calculate Fat% of milk not separated (it should be more or equal to target Fat %)
			fatPercentOfRemainingMilk = ((milkQuantity - milkToUseForCreamSeparation) * currentFatPercent) / milkQuantity;
		
			document.getElementById("milkToUseForCreamSeparation").innerHTML = roundTo(milkToUseForCreamSeparation, 2);
			document.getElementById("fatPercentOfRemainingMilk").innerHTML = roundTo(fatPercentOfRemainingMilk,2);

			document.getElementById("creamQuantity").innerHTML = roundTo(creamQuantity,2);
			document.getElementById("milkOutput").innerHTML = roundTo(milkOutput,2);

			if(fatPercentOfRemainingMilk >= targetFatPercent){
				document.getElementById("calcSuccess").style.display = '';
				document.getElementById("calcError").style.display = 'none';
			}
			else{
				document.getElementById("calcSuccess").style.display = 'none';
				document.getElementById("calcError").style.display = '';
			}
			
			document.getElementById("resultsCard").style.display = '';
			document.getElementById("msg").style.display = 'none';
		}

		return false;
	}
	
	function roundTo(num, precision) {
	  const factor = Math.pow(10, precision);
	  return Math.round(num * factor) / factor;
	}
</script>

</html>
